<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSE Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quiz-container">
    <header>
      <h2>Computer Science Quiz</h2>
      <div class="user-info">
        <span id="userInfo" class="top-right"></span>
      </div>
    </header>

    <div id="quizCard">
      <div class="timer-bar">
        <div id="timerProgress"></div>
      </div>
      <p id="question" class="question-text"></p>
      <div id="options" class="options"></div>
      <button id="nextBtn" class="next-btn">Next Question</button>
    </div>

    <footer>
      <p id="score" class="score-display"></p>
    </footer>
  </div>

  <script src="quiz.js"></script>
</body>
</html>

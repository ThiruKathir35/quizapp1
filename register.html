<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — QuizMaster Pro</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>
<body>
  <div class="page-wrapper">
    <div class="container">

      <div class="card">
        <!-- Brand -->
        <div class="brand">
          <div class="brand-icon">🎯</div>
          <span class="brand-name">Quiz<span>Master</span> Pro</span>
        </div>

        <!-- Heading -->
        <h1 class="page-title">Create Account</h1>
        <p class="page-subtitle">Join and start playing quizzes for free</p>

        <!-- Alert -->
        <div class="alert alert-error alert-hidden" id="alert-msg">
          <span>⚠</span>
          <span id="alert-text">Something went wrong.</span>
        </div>

        <!-- Form -->
        <div id="register-form">
          <div class="input-group">
            <input
              type="text"
              id="username"
              class="pw-field"
              placeholder="Username"
              autocomplete="username"
            />
            <label for="username">Username</label>
          </div>

          <div class="input-group">
            <input
              type="password"
              id="password"
              placeholder="Password"
              autocomplete="new-password"
            />
            <label for="password">Password</label>
            <button class="toggle-pw" type="button" onclick="togglePw('password', this)" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>

          <div class="input-group">
            <input
              type="password"
              id="confirm-password"
              placeholder="Confirm Password"
              autocomplete="new-password"
            />
            <label for="confirm-password">Confirm Password</label>
            <button class="toggle-pw" type="button" onclick="togglePw('confirm-password', this)" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>

          <button class="btn btn-primary mt-8" onclick="register()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            Create Account
          </button>
        </div>

        <p class="auth-footer">
          Already have an account? <a href="login.html">Sign in →</a>
        </p>
      </div>

    </div>
  </div>

  <script src="register.js"></script>
  <script>
    function togglePw(id, btn) {
      const input = document.getElementById(id);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.innerHTML = isHidden
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    }

    function showAlert(msg, type = 'error') {
      const el = document.getElementById('alert-msg');
      el.className = `alert alert-${type}`;
      document.getElementById('alert-text').textContent = msg;
    }

    function hideAlert() {
      document.getElementById('alert-msg').className = 'alert alert-error alert-hidden';
    }
  </script>
</body>
</html>
